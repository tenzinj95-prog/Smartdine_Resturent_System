<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Food Ordering | Admin</title><link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="loginView" class="login-shell">
  <form id="loginForm" class="login-card">
    <div class="brand-mark">QF</div><p class="eyebrow">ADMIN PORTAL</p><h1>Welcome back</h1><p class="muted">Sign in to manage your food ordering system.</p>
    <label>Email address<input id="email" type="email" required placeholder="admin@example.com"></label>
    <label>Password<input id="password" type="password" required placeholder="Enter password"></label>
    <button class="btn primary full" type="submit">Sign in</button><p id="loginMessage" class="message"></p>
  </form>
</div>
<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark" id="brandMark">QF</div><div><strong id="brandName">QuickBite</strong><small>Admin Console</small></div></div>
    <nav id="nav">
      <button class="nav-link active" data-page="home">▦ <span>Home</span></button>
      <button class="nav-link" data-page="categories">◈ <span>Categories</span></button>
      <button class="nav-link" data-page="items">🍽 <span>Food Items</span></button>
      <button class="nav-link" data-page="rooms">▤ <span>Rooms & Tables</span></button>
      <button class="nav-link" data-page="orders">☷ <span>Orders</span><b id="orderBadge" class="nav-badge hidden">0</b></button>
      <button class="nav-link" data-page="track">⌕ <span>Track Order</span></button>
      <button class="nav-link" data-page="reports">▥ <span>Reports</span></button>
      <button class="nav-link" data-page="users">♙ <span>User management</span></button>
      <button class="nav-link" data-page="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="admin-mini"><div class="avatar">A</div><div><strong id="adminEmail">Admin</strong><small>Administrator</small></div></div><button id="logoutBtn" class="logout">↪ Sign out</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><p class="eyebrow">MANAGEMENT</p><h2 id="pageTitle">Home</h2></div><div class="top-actions"><button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme"><span class="theme-toggle-icon">🌙</span><span class="theme-toggle-label">Dark mode</span></button><span class="live-dot">System online</span><button id="notificationBtn" class="notification-btn" type="button" aria-label="Open new order notifications">🔔<b id="topNotificationBadge" class="hidden">0</b></button><button id="topLogout" class="btn outline">Sign out</button></div></header>
    <section id="pageContent"></section>
    <footer>QuickBite Admin · QR Food Ordering System</footer>
  </main>
</div>
<div id="toast" class="toast"></div>
<dialog id="modal"><form id="modalForm" class="modal-card"><div class="modal-head"><h3 id="modalTitle">Add</h3><button type="button" id="modalClose" class="icon-btn">×</button></div><div id="modalFields"></div><div class="modal-actions"><button type="button" id="modalCancel" class="btn outline">Cancel</button><button class="btn primary" type="submit">Save</button></div><p id="modalMessage" class="message"></p></form></dialog>
<script src="js/config.js"></script><script src="js/app.js"></script>
</body></html>
